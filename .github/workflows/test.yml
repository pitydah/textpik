name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: python -m pip install -e . ruff coverage build twine
      - run: python -m unittest discover -s tests -v
      - name: V14 RC boundary truth regressions
        run: python -m unittest tests.test_popup_v14_rc -v
      - run: python scripts/check_performance.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Exercise 500 popup lifecycles
        if: matrix.python == '3.11'
        run: python scripts/check_app_stability.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m py_compile src/textpik.py src/textpik_core/*.py
      - run: ruff check src tests scripts
      - name: Enforce core coverage
        if: matrix.python == '3.11'
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=src/textpik_core -m unittest discover -s tests
          python -m coverage report --fail-under=60
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and inspect Python artifacts
        if: matrix.python == '3.11'
        run: |
          python scripts/check_release.py
          python -m build
          python -m twine check dist/*

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils build-essential \
            debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools
      - run: desktop-file-validate packaging/textpik.desktop
      - run: appstreamcli validate --no-net packaging/io.github.pitydah.textpik.metainfo.xml
      - run: >-
          bash -n packaging/install.sh packaging/run.sh
          packaging/appimage/build.sh packaging/appimage/build-container.sh
          packaging/arch/build-container.sh packaging/flatpak/build.sh
          packaging/debian/build.sh packaging/rpm/build.sh
      - run: python -m json.tool packaging/flatpak/io.github.pitydah.textpik.json >/dev/null
      - run: python scripts/check_release.py
      - name: Build and inspect Debian package
        run: |
          packaging/debian/build.sh
          dpkg-deb --info dist/textpik_*_all.deb
          dpkg-deb --contents dist/textpik_*_all.deb > "$RUNNER_TEMP/textpik-deb-contents"
          grep -q './usr/bin/textpik' "$RUNNER_TEMP/textpik-deb-contents"
      - name: Build and inspect Fedora packages
        run: |
          docker run --rm -v "$PWD:/source" -w /source fedora:latest bash -lc '
            dnf install -y -q git rpm-build python3-devel python3-pip pyproject-rpm-macros python3-setuptools
            git config --global --add safe.directory /source
            packaging/rpm/build.sh
            rpm -qpi dist/textpik-*.noarch.rpm
            rpm -qlp dist/textpik-*.noarch.rpm > /tmp/textpik-rpm-contents
            grep -q /usr/bin/textpik /tmp/textpik-rpm-contents
          '

  kwin-effect:
    # The placement backend is native and links against the KWin of the machine
    # that builds it, so it needs a distribution that ships KWin 6 development
    # files. The Ubuntu runner image only carries Plasma 5, which is why this
    # job uses the rolling Arch image instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build and verify the KWin placement effect
        run: |
          docker run --rm -v "$PWD:/source" -w /source archlinux:latest bash -lc '
            set -e
            pacman -Sy --noconfirm --needed \
              cmake ninja gcc qt6-base kwin kcoreaddons kconfig kwindowsystem
            cmake -S native/kwin-effect -B /tmp/effect -G Ninja \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/effect
            # Fails on an ABI mismatch, on a wrong plugin IID, and on a D-Bus
            # surface that does not follow the documented protocol.
            /tmp/effect/textpik-verify-effect /tmp/effect/textpik-placement.so
            # The IID has to track the headers, not a pinned literal.
            version=$(sed -n "s/^#define KWIN_PLUGIN_VERSION_STRING \"\(.*\)\"/\1/p" \
              /usr/include/kwin/config-kwin.h)
            strings /tmp/effect/textpik-placement.so \
              | grep -q "org.kde.kwin.EffectPluginFactory$version"
            echo "efecto compilado y verificado contra KWin $version"
          '

  x11-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install virtual X11 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0
      - run: python -m pip install -e .
      - name: Start, compose a profiled popup and stop on X11
        run: xvfb-run -a env TEXTPIK_SMOKE_QPA=xcb python -m unittest tests.test_smoke -v
        env:
          XDG_CURRENT_DESKTOP: GNOME
          XDG_SESSION_TYPE: x11

  wayland-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install headless Wayland runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y weston libegl1 libgl1
      - run: python -m pip install -e .
      - name: Start, compose a profiled popup and stop on Wayland
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/textpik-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-textpik \
            --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            test -S "$XDG_RUNTIME_DIR/wayland-textpik" && break
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/wayland-textpik"
          WAYLAND_DISPLAY=wayland-textpik TEXTPIK_SMOKE_QPA=wayland \
            python -m unittest tests.test_smoke -v
        env:
          XDG_CURRENT_DESKTOP: KDE
          XDG_SESSION_TYPE: wayland
